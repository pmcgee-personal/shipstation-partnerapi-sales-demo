service: shipstation-partnerapi-sales-demo

provider:
  name: aws
  runtime: nodejs20.x
  region: us-west-2
  stage: dev
  environment:
    TABLE_NAME: ${env:TABLE_NAME, 'shipstation-partnerapi-demo-accounts'}
    LOG_LEVEL: ${env:LOG_LEVEL, 'info'}
    SSM_PARAM_API_KEY: ${env:SSM_PARAM_API_KEY, '/shipstation-demo/partner-api-key'}
    SSM_PARAM_THEME_ID: ${env:SSM_PARAM_THEME_ID, '/shipstation-demo/theme-id'}
    SSM_PARAM_ELEMENTS_PRIVATE_KEY: ${env:SSM_PARAM_ELEMENTS_PRIVATE_KEY, '/shipstation-demo/elements/private-key'}
    # ShipEngine Elements platform-token signing: values from ShipEngine
    # partner onboarding (technical contact). No defaults -- generateElementsToken
    # returns a 500 until these are set for the deploy stage.
    SHIPENGINE_PARTNER_ID: ${env:SHIPENGINE_PARTNER_ID, ''}
    SHIPENGINE_SCOPE: ${env:SHIPENGINE_SCOPE, ''}
    SHIPENGINE_PLATFORM_ISSUER: ${env:SHIPENGINE_PLATFORM_ISSUER, ''}
    SHIPENGINE_PLATFORM_KEY_ID: ${env:SHIPENGINE_PLATFORM_KEY_ID, ''}
    ALLOWED_EMAIL: ${env:ALLOWED_EMAIL, 'p.mcgee1986@gmail.com'}
    ALLOWED_EMAIL_DOMAIN: ${env:ALLOWED_EMAIL_DOMAIN, '@shipstation.com'}
    # COGNITO_USER_POOL_ID/COGNITO_CLIENT_ID are set per-function below
    # (requestOtp, verifyOtp only) rather than here: putting them in the
    # global environment would make every function -- including
    # customMessage, which Cognito invokes directly via LambdaConfig --
    # depend on AuthUserPool/AuthUserPoolClient, creating a circular
    # CloudFormation dependency (AuthUserPool -> customMessage function
    # -> AuthUserPoolClient -> AuthUserPool).
  # For backwards-compatibility with Serverless v2, we declare permissions here:
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:Scan
        - dynamodb:UpdateItem # Permission to update records
      Resource:
        - arn:aws:dynamodb:*:*:table/shipstation-partnerapi-demo-accounts
    - Effect: Allow
      Action:
        - ssm:GetParameter
      Resource:
        - arn:aws:ssm:*:*:parameter/shipstation-demo/*
    - Effect: Allow
      Action:
        - cognito-idp:AdminCreateUser
        - cognito-idp:AdminGetUser
        - cognito-idp:AdminInitiateAuth
        - cognito-idp:AdminRespondToAuthChallenge
      Resource:
        - Fn::GetAtt: [AuthUserPool, Arn]

# We will define our Lambda endpoints here.
functions:
  createAccount:
    handler: handler.createAccount
    events:
      - http:
          path: api/accounts
          method: post
          cors: true
          authorizer: &cognitoAuthorizer
            name: CognitoAuthorizer
            type: COGNITO_USER_POOLS
            arn:
              Fn::GetAtt: [AuthUserPool, Arn]

  listAccounts:
    handler: handler.listAccounts
    events:
      - http:
          path: api/accounts
          method: get
          cors: true
          authorizer: *cognitoAuthorizer

  # Get a single account's details
  getAccount:
    handler: handler.getAccount
    events:
      - http:
          path: api/accounts/{accountId}
          method: get
          cors: true
          authorizer: *cognitoAuthorizer

  directLogin:
    handler: handler.directLogin
    events:
      - http:
          path: api/direct-login
          method: post
          cors: true
          authorizer: *cognitoAuthorizer

  listCarriers:
    handler: handler.listCarriers
    events:
      - http:
          path: api/carriers/{accountId}
          method: get
          cors: true
          authorizer: *cognitoAuthorizer

  listWarehouses:
    handler: handler.listWarehouses
    events:
      - http:
          path: api/warehouses/{accountId}
          method: get
          cors: true
          authorizer: *cognitoAuthorizer

  createWarehouse:
    handler: handler.createWarehouse
    events:
      - http:
          path: api/warehouses/{accountId}
          method: post
          cors: true
          authorizer: *cognitoAuthorizer

  # Signs a ShipEngine Elements Platform JWT (RS256) for the given seller
  # account. Server-side only -- see handler.generateElementsToken.
  generateElementsToken:
    handler: handler.generateElementsToken
    events:
      - http:
          path: api/elements-token/{accountId}
          method: get
          cors: true
          authorizer: *cognitoAuthorizer

  # Public, unauthenticated: issuing the very first credential.
  requestOtp:
    handler: handler.requestOtp
    environment:
      COGNITO_USER_POOL_ID:
        Ref: AuthUserPool
      COGNITO_CLIENT_ID:
        Ref: AuthUserPoolClient
    events:
      - http:
          path: api/auth/request-code
          method: post
          cors: true

  verifyOtp:
    handler: handler.verifyOtp
    environment:
      COGNITO_USER_POOL_ID:
        Ref: AuthUserPool
      COGNITO_CLIENT_ID:
        Ref: AuthUserPoolClient
    events:
      - http:
          path: api/auth/verify-code
          method: post
          cors: true

  # Cognito trigger: brands the passwordless EMAIL_OTP sign-in email.
  # Invoked directly by Cognito (LambdaConfig below), not via HTTP.
  customMessage:
    handler: handler.customMessage
    # Dedicated role: the shared execution role grants cognito-idp
    # permissions scoped to AuthUserPool's ARN, which would create a
    # circular dependency (AuthUserPool -> this function -> shared role
    # -> AuthUserPool) since Cognito invokes this function directly.
    role: CustomMessageExecutionRole

# CloudWatch Alarms for monitoring
resources:
  Resources:
    CustomMessageExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: CustomMessageLogs
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - Fn::Sub: "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${self:provider.stage}-customMessage:*"

    # Cognito User Pool: passwordless email OTP sign-in.
    # AllowedFirstAuthFactors/EMAIL_OTP requires the Essentials feature
    # tier, which is the CloudFormation default for new user pools.
    AuthUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:service}-${self:provider.stage}-users
        UserPoolTier: ESSENTIALS
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        MfaConfiguration: OFF
        AdminCreateUserConfig:
          AllowAdminCreateUserOnly: true
        EmailConfiguration:
          EmailSendingAccount: COGNITO_DEFAULT
        LambdaConfig:
          CustomMessage:
            Fn::GetAtt: [CustomMessageLambdaFunction, Arn]
        Policies:
          SignInPolicy:
            AllowedFirstAuthFactors:
              - EMAIL_OTP
              - PASSWORD
        Schema:
          - Name: email
            AttributeDataType: String
            Mutable: true
            Required: true

    CustomMessageLambdaPermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName:
          Fn::GetAtt: [CustomMessageLambdaFunction, Arn]
        Principal: cognito-idp.amazonaws.com
        SourceArn:
          Fn::GetAtt: [AuthUserPool, Arn]

    AuthUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:service}-${self:provider.stage}-client
        UserPoolId:
          Ref: AuthUserPool
        ExplicitAuthFlows:
          - ALLOW_USER_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
        GenerateSecret: false
        PreventUserExistenceErrors: ENABLED

    # Without these, API Gateway drops CORS headers on 401/403 responses
    # from the Cognito authorizer, and browsers surface an opaque CORS
    # error instead of the real status code.
    GatewayResponseUnauthorized:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: UNAUTHORIZED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

    GatewayResponseAccessDenied:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: ACCESS_DENIED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

    # Alarm: Lambda Errors
    LambdaErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-lambda-errors
        AlarmDescription: Alert when Lambda functions have errors
        MetricName: Errors
        Namespace: AWS/Lambda
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    # Alarm: Lambda Throttling
    LambdaThrottlesAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-lambda-throttles
        AlarmDescription: Alert when Lambda functions are throttled
        MetricName: Throttles
        Namespace: AWS/Lambda
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    # Alarm: Lambda Duration (slow requests)
    LambdaDurationAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-lambda-high-duration
        AlarmDescription: Alert when Lambda functions take too long
        MetricName: Duration
        Namespace: AWS/Lambda
        Statistic: Average
        Period: 300
        EvaluationPeriods: 2
        Threshold: 5000
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching

    # Alarm: API Gateway 5xx Errors
    APIGateway5xxAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-apigw-5xx
        AlarmDescription: Alert on API Gateway 5xx errors
        MetricName: 5XXError
        Namespace: AWS/ApiGateway
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 10
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
